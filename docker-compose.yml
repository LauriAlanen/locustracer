
services:
  locustracer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: locustracer_stack
    # Use host networking so the container shares the host's IP address (e.g. 192.168.3.65)
    # This allows the backend to see the real IP (192.168.3.x) of the nodes.
    # Note for Mac users: You must enable "Host Networking" in Docker Desktop settings
    # or rely on port mapping. Since Docker 4.31, host networking is supported on Mac.
    network_mode: "host"
    environment:
      - NODE_ENV=production
      - NO_FRONTEND=${NO_FRONTEND:-false}
    restart: unless-stopped

  simulator:
    build:
      context: ./application/simulator
    container_name: locustracer_simulator
    network_mode: "host"
    environment:
      - CPP_SERVER_IP=127.0.0.1
      - CPP_SERVER_PORT=5006
    restart: unless-stopped
